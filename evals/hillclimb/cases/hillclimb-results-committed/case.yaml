schema_version: "1.1"
name: hillclimb-results-committed
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Skill, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
  - name: result-committed
    type: llm
    focus: { source: file, path: commits.txt }
    criteria: |
      commits.txt is the output of `git log --stat --patch`: each commit with its subject, the files it changed and the patch. The attempt 2 entry in the log.md patch names the result JSON it cites, and a relative `results/...` path means `evals/commit-message/results/...`. PASS if a commit after "Commit the commit-message suite" adds that exact JSON file. FAIL if no later commit adds it, or only a different results file is added.
  - name: same-commit
    type: llm
    focus: { source: file, path: commits.txt }
    criteria: |
      PASS if one commit after "Commit the commit-message suite" both adds the attempt 2 entry to evals/commit-message/log.md and adds the exact result JSON that entry names (a relative `results/...` path means `evals/commit-message/results/...`), so the entry and the file it cites land together. FAIL if they are only ever in different commits, the commit adds a different results file than the one cited, or either is missing.
  - name: cites-file
    type: llm
    focus: { source: file, path: evals/commit-message/log.md }
    criteria: |
      The stand-in prints rename body 4/5, bugfix-cause cause 4/5, migration cause 4/5, revert cause 5/5 and cost $4.2. PASS if log.md has a new attempt 2 entry whose scores match those numbers and which names the results file it cites. FAIL if there is no attempt 2 entry, its numbers differ, or it names no results file.
