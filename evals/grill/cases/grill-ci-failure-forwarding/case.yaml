schema_version: "1.1"
name: grill-ci-failure-forwarding
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 150
  timeout_seconds: 3000
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Skill, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"dispatch:grill"'
  - name: how-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"dispatch:how"'
  - name: why-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"dispatch:why"'
  - name: arena-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"dispatch:arena"'
  - name: candidates-get-grounding
    type: llm
    focus: trace
    criteria: |
      PASS if at least 3 design candidate Agent calls (not the how explorers, not the judge) were given the grounding file `scratch/grounding.md`, either by naming it in the Agent prompt or by pointing at a file the worker wrote earlier whose text names it. FAIL otherwise.
  - name: candidates-get-runner-prompt
    type: llm
    focus: trace
    criteria: |
      PASS if at least 3 design candidate Agent calls were given the grill skill's runner prompt (text such as "Caller's usage first", or the path `references/runner-prompt.md`), either in the Agent prompt or in a file the prompt points at that the worker wrote earlier. FAIL otherwise.
  - name: candidates-get-objective
    type: llm
    focus: trace
    criteria: |
      PASS if at least 3 design candidate Agent calls were given the approved Objective (the word "Objective" or its text about forwarding a failing check once per check run), either in the Agent prompt or in a file the prompt points at that the worker wrote earlier. FAIL otherwise.
  - name: grounding-traced
    type: llm
    focus: { source: file, path: scratch/grounding.md }
    criteria: |
      PASS if the file traces how the dispatcher forwards pull request events today and holds both of these. First, at least three specific code locations (file paths in this repo, with a function or type name) each with what it does in the flow. Second, at least one reason taken from the repo's history or decision log for why the current shape exists (for example the dispatcher as event broker, or why workers never poll). FAIL if it is a list of file names without tracing, describes the code from general knowledge, or has no recorded reason.
  - name: candidates-cite-grounding
    type: llm
    focus: { source: file, path: evidence.md }
    criteria: |
      The file holds a grounding section, then one section per candidate. PASS if every candidate section uses at least one specific code location (file path with a function or type name) or one recorded decision that appears in the grounding section and does not appear in the feature ticket's Objective, and the candidate relies on it in its design (for example it extends or avoids a named function because of what the grounding says it does). FAIL if any candidate section is missing, or cites only the Objective, or names no code or decision from the grounding.
  - name: last-message-asks-sketch
    type: llm
    focus: last_message
    criteria: |
      PASS if the message shows the contract sketch (what a caller or test sees) and asks the user to approve it or push back on the shape. FAIL if it asks the user to choose among the candidates, or reports that the arena awaits the user's answer, or shows no sketch.
