schema_version: "1.1"
name: refactor-billing-cli
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Skill, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"dispatch:refactor-domains"'
  - name: problem-domains-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"dispatch:principle-problem-domains"'
  - name: surface-testing-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"dispatch:surface-testing"'
  - name: purpose-line
    type: llm
    focus: { source: file, path: blueprint.md }
    criteria: |
      PASS if the first line of body text (the first line that is not a heading or blank) is `Purpose: refactor`, possibly followed by a clause. FAIL otherwise.
  - name: problems-cited
    type: llm
    focus: { source: file, path: blueprint.md }
    criteria: |
      PASS if the file has a numbered list of what is wrong today and every item cites a real file in this repo with a line number or range (for example internal/store/store.go:30-45). The files that exist are billing.go, internal/util/util.go, internal/store/store.go and the tests. FAIL if there is no such list, an item has no file and line cite, or a cited file does not exist.
  - name: product-use-kept
    type: llm
    focus: { source: file, path: blueprint.md }
    criteria: |
      PASS if the blueprint keeps the CLI's commands (issue, pay, statement), their arguments, their output and their error messages exactly as they are, and any public name it renames is listed on its own with the domain term that justifies it. FAIL if it renames or reshapes commands, flags, output or messages without that, or is silent on whether usage changes.
  - name: saved-data-kept
    type: llm
    focus: { source: file, path: blueprint.md }
    criteria: |
      PASS if the blueprint says the saved data stays as it is and names at least these: the Invoice JSON field names Number, CustomerID and Cents (which have no json tags, so the Go field names are the saved names), and the directory and file names invoices/, payments/ and invoice-counter. FAIL if it moves or renames any of them, or does not mention the untagged field names.
  - name: names-from-domain
    type: llm
    focus: { source: file, path: blueprint.md }
    criteria: |
      PASS if every package the blueprint creates is named with a term from docs/CONTEXT.md (invoice, payment, statement, balance) or a term it adds under a Glossary changes section. FAIL if any new package is named for a technical layer or role (models, services, handlers, util, helpers, manager, common) or for a term in neither place.
  - name: new-package-earns-place
    type: llm
    focus: { source: file, path: blueprint.md }
    criteria: |
      PASS if, for each new package, the blueprint says how many files a reader opens to answer a question before and after, or why the package cuts that number. A blueprint that creates no new package passes. FAIL if a new package is justified only by tidiness or layering.
  - name: test-cases-unchanged
    type: llm
    focus: { source: file, path: blueprint.md }
    criteria: |
      PASS if the blueprint says billing_test.go's test cases change in no piece that moves code, and any test edit is limited to the harness (harness_test.go), a moved package's own tests, or follow-up tickets. FAIL if it plans to rewrite, split or delete the existing test cases, or is silent on tests.
  - name: pieces-have-kinds
    type: llm
    focus: { source: file, path: blueprint.md }
    criteria: |
      PASS if the blueprint lists pieces and labels each as one of three kinds (moves code only, adds test cases only, changes a public surface). FAIL if pieces are missing or any piece has no kind.
  - name: pieces-have-proof
    type: llm
    focus: { source: file, path: blueprint.md }
    criteria: |
      PASS if each piece that moves code only has an acceptance criterion that the existing suite passes and a single `git diff` command against the merge base that must print nothing (no pipe, no command substitution) and that covers the test files. FAIL otherwise.
  - name: left-out-listed
    type: llm
    focus: { source: file, path: blueprint.md }
    criteria: |
      PASS if the blueprint has a section naming what it leaves out on purpose. FAIL otherwise.
