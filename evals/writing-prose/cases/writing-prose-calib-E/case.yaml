schema_version: "1.1"
name: writing-prose-calib-E
tags: [calib]
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 10
  timeout_seconds: 600
  allowed_tools: [Read, Write, Edit, Skill, Agent]
graders:
  - name: walkthrough
    type: "llm"
    criteria: "The section answers the question of how a thing works. PASS if it is organized as a walk through what happens, in order: it takes one call or one action as its spine (what the caller does, then what happens next, then what happens when something goes wrong), and each paragraph after the opening continues that sequence from where the previous one stopped, so a reader could retell it as a story. FAIL if it is organized as a tour of the parts, with one paragraph or sentence per component, option or default, so that the paragraphs could be reordered without changing what the reader understands. Judge the whole section, and do not judge the sentences or the choice of facts."
    focus: { source: "file", path: "section.md" }
