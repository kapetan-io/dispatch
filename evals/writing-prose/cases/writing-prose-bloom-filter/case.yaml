schema_version: "1.1"
name: writing-prose-bloom-filter
tags: [suite]
execution:
  model: claude-sonnet-5-5
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill, Agent]
graders:
  - name: skill-fired
    type: "tool_used"
    tool: "Skill"
    input_match: "\"skill\":\\s*\"(dispatch:)?writing-prose\""
  - name: key-absent
    type: "regex"
    target: { source: "file", path: "section.md" }
    pattern: "^(?![\\s\\S]*(?:double[- ]hash|two hash values|\\bln\\s*2\\b|natural log|counting (bloom|variant|filter)|counters? (instead|in place)))[\\s\\S]*$"
    flags: "i"
  - name: no-verify
    type: "regex"
    target: { source: "file", path: "section.md" }
    pattern: "^(?![\\s\\S]*\\[VERIFY)[\\s\\S]*$"
    flags: "i"
  - name: under-cap
    type: "regex"
    target: { source: "file", path: "section.md" }
    pattern: "^\\s*(?:\\S+(?:\\s+|$)){1,290}$"
