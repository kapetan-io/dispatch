schema_version: "1.1"
name: refund-negative
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Skill, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\":\\s*\"(dispatch:)?supervise\""
  - name: validator-told
    type: tool_used
    tool: Agent
    input_match: "^(?![\\s\\S]*(?:go test(?:\\s+(?!-run)-\\S+(?:\\s+'[^']*'|\\s+[^\\s-]\\S*)?)*\\s+\\./\\S*|go test(?:\\s+-\\S+(?:\\s+'[^']*'|\\s+[^\\s-]\\S*)?)*\\s+\\./\\.\\.\\.))[\\s\\S]*go test(?=(?:(?!\\\\n)[^;&|])*-count=1)(?=(?:(?!\\\\n)[^;&|])*-run)(?=(?:(?!\\\\n)[^;&|])*\\./[\\w<])"
    min: 1
  - name: no-full-run
    type: tool_used
    tool: Bash
    input_match: "go test(?!(?:(?!\\\\n)[^;&|])*-run)|go test(?:(?!\\\\n)[^;&|])*\\./\\.\\.\\."
    min: 0
    max: 0
