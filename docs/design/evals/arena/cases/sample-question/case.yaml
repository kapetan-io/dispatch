schema_version: "1.1"
name: sample-question
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 120
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Skill, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
  - name: fan-out
    type: tool_used
    tool: Agent
  - name: rubric
    type: llm
    focus: { source: file, path: arena/rubric.md }
    criteria: |
      PASS if the file holds 3 to 6 separately gradeable criteria for judging an answer to the polling question, each stating what a good answer does. FAIL if it is missing, has fewer than 3 or more than 6, or lists vague qualities such as "quality" or "clarity" with no test.
  - name: candidates
    type: llm
    focus: { source: file, path: note.md }
    criteria: |
      PASS if the note shows at least three independent candidate attempts were made and names which model each ran on, with at least two different models among them. FAIL if it shows fewer than three, or all on one model.
  - name: prompt-premise
    type: llm
    focus: { source: file, path: arena/prompt.md }
    criteria: |
      This is the prompt given to every candidate. PASS if it tells the candidate to name at least one premise of the question and to answer whether, if the mechanism were built from scratch with every signal now available, it would exist, before answering the question as asked. FAIL if either instruction is missing.
  - name: prompt-clean
    type: llm
    focus: { source: file, path: arena/prompt.md }
    criteria: |
      The question assumes the service polls, and the supplier docs show a webhook event makes polling unnecessary. PASS if the prompt does not state polling as a fixed requirement or settled constraint (it may mention polling as today's behavior or as the question's subject), and does not hand the candidates the rubric. FAIL if it presents polling as required, or includes the rubric criteria.
  - name: note
    type: llm
    focus: { source: file, path: note.md }
    criteria: |
      PASS if the note names the base candidate, each graft with the candidate it came from (or says there were none and why), what was rejected, any dropouts (or says none), the judge's verdict, and the premises tested with what the candidates concluded about each. FAIL if any of those is missing.
  - name: premise-resolved
    type: llm
    focus: { source: file, path: note.md }
    criteria: |
      PASS if the note reports whether any candidate questioned the polling premise. If none did, the note must say the arena was run again with the premise removed from the prompt. If some did, it must say what they concluded. FAIL if the note claims convergence confirms the shape while no candidate tested a premise, or does not address it.
  - name: asked
    type: llm
    focus: { source: file, path: final.md }
    criteria: |
      PASS if the message shows the user the result and asks before anything is filed or changed, and states that nothing was filed or changed. FAIL if it says it filed, edited or changed something, or shows no result, or asks nothing.
