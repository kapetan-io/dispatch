schema_version: "1.1"
name: why-unknown-keys
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Write, Bash, Skill, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
  - name: cited
    type: llm
    focus: { source: file, path: answer.md }
    criteria: |
      PASS if the answer cites at least one concrete source: the commit "Reject unknown config keys and add a user guide and config reference" (334430a), internal/config/config.go, or docs/config.md. FAIL if it cites nothing checkable.
  - name: reason
    type: llm
    focus: { source: file, path: answer.md }
    criteria: |
      PASS if the answer says a mistyped setting would otherwise fall back to its default without anyone noticing, so the config is rejected with an error naming the setting and the file. FAIL if it gives another reason or none.
