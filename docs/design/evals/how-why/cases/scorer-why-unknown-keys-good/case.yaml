schema_version: "1.1"
name: scorer-why-unknown-keys-good
tags: [scorer]
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Write, Bash, Skill, Agent]
graders:
  - name: cited
    type: regex
    target: { source: "file", path: "answer.md" }
    pattern: "334430a"
    flags: "i"
  - name: reason
    type: llm
    criteria: "PASS if the answer says a mistyped setting would otherwise fall back to its default without anyone noticing, so loading the config fails with an error that names the setting and the file. FAIL if it gives another reason or none."
    focus: { source: "file", path: "answer.md" }
