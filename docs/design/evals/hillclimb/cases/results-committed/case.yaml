schema_version: "1.1"
name: results-committed
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Skill, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
  - name: result-committed
    type: llm
    focus: { source: file, path: commits.txt }
    criteria: |
      commits.txt is the output of `git log --stat`: each commit with its subject and the files it changed. PASS if some commit after "Commit the commit-message suite" changes a .json file under a results/ directory (for example evals/commit-message/results/attempt-2.json). FAIL if no later commit adds a results/ JSON file.
  - name: same-commit
    type: llm
    focus: { source: file, path: commits.txt }
    criteria: |
      PASS if one commit changes both evals/commit-message/log.md and a .json file under a results/ directory, so the log entry and the result it cites land together. FAIL if the log entry and the result file are only ever in different commits, or either is missing.
  - name: cites-file
    type: llm
    focus: { source: file, path: evals/commit-message/log.md }
    criteria: |
      The stand-in prints rename body 4/5, bugfix-cause cause 4/5, migration cause 4/5, revert cause 5/5 and cost $4.2. PASS if log.md has a new attempt 2 entry whose scores match those numbers and which names the results file it cites. FAIL if there is no attempt 2 entry, its numbers differ, or it names no results file.
