name: adr-check

# A reusable check that fails a pull request when an ADR under docs/adr cites a
# ticket, a file or directory in the repo, or the repo's pull requests, commits,
# branches or issues, has a missing Status or one outside the allowed forms, shares
# its number with another ADR, or links to an ADR that doesn't exist. A path with
# a `*` inside it, and a path in a fenced block opened with ```quoted, are not repo files.
# A repo calls it:
#
#   jobs:
#     adr:
#       uses: kapetan-io/dispatch/.github/workflows/adr-check.yml@main
#       with:
#         ticket-keys: ENG
#
# It runs `make adr-check` from a checkout of dispatch against the caller's tree.
# A caller that pins this file to a tag passes the same tag as dispatch-ref, so the
# workflow and the check come from one version.
on:
  workflow_call:
    inputs:
      ticket-keys:
        description: Linear team keys whose ticket ids an ADR must not cite, comma separated (ENG,OPS)
        required: true
        type: string
      dispatch-ref:
        description: The dispatch commit, branch or tag whose check runs
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kapetan-io/dispatch
          ref: ${{ inputs.dispatch-ref }}
          path: .dispatch
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .dispatch/go.mod
          cache-dependency-path: .dispatch/go.sum
      # Inputs reach the shell through the environment, never spliced into the script.
      # make expands $(...) in command-line variables, so anything but letters,
      # digits, commas and spaces is refused before make sees it.
      - env:
          ADR_TICKET_KEYS: ${{ inputs.ticket-keys }}
          ADR_REPO: ${{ github.repository }}
        run: |
          if [[ ! "$ADR_TICKET_KEYS" =~ ^[A-Za-z0-9,\ ]+$ ]]; then
            echo "ticket-keys must be team keys separated by commas, such as ENG,OPS" >&2
            exit 2
          fi
          make -C .dispatch adr-check ADR_ROOT="$GITHUB_WORKSPACE/repo" ADR_TICKET_KEYS="$ADR_TICKET_KEYS" ADR_REPO="$ADR_REPO"
