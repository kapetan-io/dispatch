name: label-changed-tests

# Labels this repo's pull requests changes-existing-tests through the reusable workflow.
# It lives apart from test.yml, which runs PR code and keeps a read-only token. The labeler
# comes from the pull request's own head, so a change to it is checked on its own PR.
on:
  pull_request:

jobs:
  label:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/changes-existing-tests.yml
    with:
      dispatch-ref: ${{ github.event.pull_request.head.sha }}
