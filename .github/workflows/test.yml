name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The jobs run PR code and push nothing, so the token stays read-only and out
# of the checkout's git config.
permissions:
  contents: read

jobs:
  # A workflow-level paths-ignore would leave a required `test` check waiting
  # forever on a PR it skips. Deciding here keeps `test` reporting on every PR.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3.0.2
        id: filter
        with:
          # What the Go tests and shellcheck read, testdata/ included. No test
          # reads skills/**, evals/** or CLAUDE.md.
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'README.md'
              - 'docs/**'
              - 'rules/**'
              - 'testdata/**'
              - '.claude-plugin/**'
              - 'hooks/hooks.json'
              - 'bin/dispatch-launch'
              - 'scripts/shims/claude'
              - '.github/workflows/**'

  # Every step carries the same condition and the job never skips, so the
  # `test` check reports a pass on a PR with nothing to test. When `changes`
  # fails its output is empty, which is not 'false', so the tests run.
  test:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.code != 'false' || github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # committimes reads the full history.
          fetch-depth: 0
      - if: needs.changes.outputs.code != 'false' || github.event_name != 'pull_request'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # actions/cache below owns the build and test cache, because
          # setup-go saves only when go.sum changes.
          cache: false
      - if: needs.changes.outputs.code != 'false' || github.event_name != 'pull_request'
        id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - if: needs.changes.outputs.code != 'false' || github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.gocache.outputs.dir }}
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      # go test's result cache compares file and directory times, which a fresh checkout resets.
      - if: needs.changes.outputs.code != 'false' || github.event_name != 'pull_request'
        run: go run ./cmd/committimes
      # The surface tests run against fake tools and a real git, which the
      # runner image provides. The drift check (make test-drift) needs the
      # installed tools and does not run here. make ci runs no -race: it
      # multiplies CPU time about 6 times and CI has no concurrency check the
      # dev box does not already run.
      - if: needs.changes.outputs.code != 'false' || github.event_name != 'pull_request'
        run: make ci
