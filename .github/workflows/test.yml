name: test

# Paused while the test refactor (ENG-473) runs, to save Actions minutes.
# Restore `pull_request:` and `push: branches: [main]` to turn CI back on.
on:
  workflow_dispatch:

# The job runs PR code and pushes nothing, so its token stays read-only and
# out of the checkout's git config.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        # The surface tests run against fake tools and a real git, which the
        # runner image provides. The drift check (go test -tags drift
        # ./internal/...) needs the installed tools and does not run here.
        run: go test -race ./...
      - name: shellcheck
        run: shellcheck -S warning bin/dispatch-launch scripts/shims/claude
