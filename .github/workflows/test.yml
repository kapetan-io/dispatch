name: test

on:
  pull_request:
  push:
    branches: [main]

# The job runs PR code and pushes nothing, so its token stays read-only and
# out of the checkout's git config.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        # The surface tests drive `dispatch launch` against fake herdr and
        # treehouse scripts and a real git, which the runner image provides.
        run: go test -race ./...
      - name: shellcheck
        run: shellcheck -S warning bin/dispatch-launch scripts/shims/claude
