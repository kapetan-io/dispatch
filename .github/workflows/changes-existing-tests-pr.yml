name: changes-existing-tests-pr

# Labels this repo's pull requests changes-existing-tests through the reusable workflow. It
# needs pull-requests: write, which test.yml doesn't grant, so it lives in its own file. It
# runs the labeler from the pull request's own head, so a change to the labeler is checked on
# its own PR. That runs PR code with a write token, and only same-repo PRs reach it, whose
# authors can already edit this file.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  changes-existing-tests:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/changes-existing-tests.yml
    with:
      dispatch-ref: ${{ github.event.pull_request.head.sha }}
